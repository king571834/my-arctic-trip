<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北極光之約 - 14天芬蘭挪威夢幻之旅</title>
    <link href="https://cloudflare.com" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #0284c7;
            --accent: #0d9488;
            --bg-light: #f8fafc;
            --text-dark: #334155;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text-dark); background-color: var(--bg-light); line-height: 1.6; }
        
        /* 頂部旅行社級橫幅 */
        .hero { background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), url('https://unsplash.com') center/cover no-repeat; height: 20vh; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: 1px; }
        .hero p { font-size: 0.95rem; opacity: 0.85; margin-top: 5px; }

        /* 頁籤切換佈局 */
        .travel-layout { max-width: 1100px; margin: 30px auto; padding: 0 20px; display: flex; gap: 25px; }
        
        /* 左側天數選單 */
        .tab-menu { width: 28%; display: flex; flex-direction: column; gap: 8px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); height: fit-content; }
        .tab-btn { background: none; border: none; padding: 12px 15px; text-align: left; font-size: 0.95rem; font-weight: bold; color: var(--text-dark); border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 12px; border-left: 4px solid transparent; }
        .tab-btn:hover { background-color: #f1f5f9; color: var(--secondary); }
        .tab-btn.active { background-color: #e0f2fe; color: var(--secondary); border-left-color: var(--secondary); }
        
        /* 右側行程顯示區 */
        .tab-content-container { width: 72%; }
        .tab-content { display: none; background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.03); animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 右側詳細圖文 */
        .content-img { width: 100%; height: 380px; overflow: hidden; background-color: #e2e8f0; }
        .content-img img { width: 100%; height: 100%; object-fit: cover; }
        .content-body { padding: 35px; }
        .content-days { font-size: 0.85rem; font-weight: 800; color: var(--secondary); letter-spacing: 1px; margin-bottom: 5px; }
        .content-title { font-size: 1.4rem; color: var(--primary); font-weight: 700; margin-bottom: 15px; line-height: 1.4; }
        
        /* 標籤樣式 */
        .meta-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .tag { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
        .tag-trans { background-color: #f0f9ff; color: #0284c7; }
        .tag-stay { background-color: #f0fdf4; color: #16a34a; }
        .content-desc { font-size: 1rem; color: var(--text-dark); text-align: justify; line-height: 1.8; border-top: 1px solid #e2e8f0; padding-top: 20px; }

        /* 行動裝置自動適應 */
        @media (max-width: 768px) {
            .travel-layout { flex-direction: column; }
            .tab-menu { width: 100%; flex-direction: row; overflow-x: auto; padding: 10px; }
            .tab-btn { white-space: nowrap; padding: 10px 18px; border-left: none; border-bottom: 3px solid transparent; }
            .tab-btn.active { border-bottom-color: var(--secondary); background-color: transparent; }
            .tab-content-container { width: 100%; }
            .content-img { height: 220px; }
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>北極光之約</h1>
        <p>芬蘭、挪威 14 天跨國夢幻極光與海島探索之旅</p>
    </div>

    <div class="travel-layout">
        <!-- 左側切換選單（徹底純淨，只保留 Day 1） -->
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab(event, 'day1')"><i class="fa-solid fa-calendar-day"></i> DAY 01</button>
        </div>

        <!-- 右側內容顯示區 -->
        <div class="tab-content-container">
            
            <!-- Day 1 唯一展示區塊 -->
            <div id="day1" class="tab-content active">
                <div class="content-img">
                    <!-- 改用 Unsplash 官方最穩定的愛沙尼亞塔林雪景直連圖 -->
                    <img src="https://unsplash.com" alt="Tallinn Snow View">
                </div>
                <div class="content-body">
                    <div class="content-days">DAY 01</div>
                    <div class="content-title">抵達赫爾辛基 ➔ 跨國快閃中世紀塔林古城</div>
                    <div class="meta-tags">
                        <span class="tag tag-trans"><i class="fa-solid fa-ship"></i> Tallink Silja 快船</span>
                        <span class="tag tag-stay"><i class="fa-solid fa-hotel"></i> 赫爾辛基市區精品飯店</span>
                    </div>
                    <p class="content-desc">
                        班機於早晨順利抵達芬蘭首都赫爾辛基中央車站，我們將大件行李寄存妥當後，8人團隊輕裝前往碼頭，搭乘雙體快船跨越波羅的海，直奔愛沙尼亞的「塔林古城」。<br><br>
                        漫步在保存最完整的中世紀童話鵝卵石街道上，走訪亞歷山大·涅夫斯基主教座堂。接著登上著名的 Patkuli 觀景台，俯瞰被白雪覆蓋的紅磚屋頂與古老城牆，拍下明信片般的震撼美景。傍晚帶著浪漫的歐風回憶，搭船返回赫爾辛基中央車站旁入住精品飯店。
                    </p>
                </div>
            </div>

        </div>
    </div>

    <script>
        function switchTab(event, dayId) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));
            
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(dayId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
